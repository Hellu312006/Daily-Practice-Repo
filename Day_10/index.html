<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="An interactive, premium-designed Data Structures & Algorithms visualizer featuring step-by-step sorting, binary search, stack, and queue operations.">
    <title>Interactive DSA Visualizer - Day 10</title>
    <!-- Google Fonts: Inter and Fira Code for code blocks -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="logo-area">
                <span class="logo-icon">⚡</span>
                <h1 class="logo-title">Interactive DSA Visualizer</h1>
            </div>
            <nav class="category-nav">
                <button class="nav-tab active" id="tab-sorting" onclick="switchCategory('sorting')">Sorting Algorithms</button>
                <button class="nav-tab" id="tab-searching" onclick="switchCategory('searching')">Binary Search</button>
                <button class="nav-tab" id="tab-stack" onclick="switchCategory('stack')">Stack Operations</button>
                <button class="nav-tab" id="tab-queue" onclick="switchCategory('queue')">Queue Operations</button>
            </nav>
        </header>

        <!-- Main Workspace Grid -->
        <main class="app-workspace">
            
            <!-- Sidebar Controls Panel -->
            <section class="controls-panel card" aria-label="Controls Panel">
                <div class="control-group">
                    <label for="algorithm-select" class="group-label">Select Algorithm</label>
                    <div class="select-wrapper">
                        <select id="algorithm-select" onchange="onAlgorithmChange()">
                            <!-- Dynamic options populated by JS based on selected category -->
                        </select>
                    </div>
                </div>

                <hr class="divider">

                <!-- Array controls (Visible for Sorting & Searching) -->
                <div id="array-controls" class="control-subgroup">
                    <div class="control-group">
                        <div class="label-with-value">
                            <label for="array-size-slider">Array Size</label>
                            <span id="array-size-val" class="badge">25</span>
                        </div>
                        <input type="range" id="array-size-slider" min="10" max="50" value="25" oninput="onSizeChange(this.value)">
                    </div>

                    <div class="control-group button-row">
                        <button id="btn-generate" class="btn btn-secondary" onclick="generateNewData()">Generate New</button>
                        <button id="btn-custom" class="btn btn-outline" onclick="promptCustomInput()">Custom...</button>
                    </div>
                </div>

                <!-- Stack / Queue controls (Visible for Stack & Queue) -->
                <div id="ds-controls" class="control-subgroup hidden">
                    <div class="control-group">
                        <label for="ds-input" class="group-label">Element Value</label>
                        <input type="number" id="ds-input" class="text-input" placeholder="e.g. 42" min="1" max="99">
                    </div>
                    <div class="control-group button-row">
                        <button id="btn-ds-push" class="btn btn-primary" onclick="executeDSAction('push')">Push</button>
                        <button id="btn-ds-pop" class="btn btn-danger" onclick="executeDSAction('pop')">Pop</button>
                    </div>
                </div>

                <hr class="divider">

                <!-- Animation Controls -->
                <div class="control-group">
                    <div class="label-with-value">
                        <label for="speed-slider">Speed</label>
                        <span id="speed-val" class="badge">500ms</span>
                    </div>
                    <input type="range" id="speed-slider" min="50" max="2000" step="50" value="500" oninput="onSpeedChange(this.value)">
                </div>

                <!-- Playback Controllers -->
                <div class="playback-controls">
                    <button id="btn-reset" class="btn-icon" title="Reset Simulation" onclick="resetSimulation()">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
                    </button>
                    <button id="btn-play-pause" class="btn-play" title="Play / Pause" onclick="togglePlayPause()">
                        <svg id="play-icon" viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                        <svg id="pause-icon" class="hidden" viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                    </button>
                    <button id="btn-step" class="btn-icon" title="Step Forward" onclick="stepForward()">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
                    </button>
                </div>
            </section>

            <!-- Center Visualizer Canvas -->
            <section class="visualizer-container card" aria-label="Visualizer Canvas">
                <div id="visualizer-canvas" class="visualizer-canvas">
                    <!-- Dynamic visual components (bars or nodes) go here -->
                </div>
            </section>

            <!-- Bottom/Side Info and Explanation Panels -->
            <section class="info-panel card" aria-label="Explanation Panel">
                <div class="info-tabs">
                    <button class="info-tab active" id="info-tab-details" onclick="switchInfoTab('details')">Details & Explanation</button>
                    <button class="info-tab" id="info-tab-code" onclick="switchInfoTab('code')">Pseudocode</button>
                </div>

                <div class="info-tab-content" id="info-content-details">
                    <!-- Current Action Status Banner -->
                    <div class="status-banner" id="status-text">
                        Click 'Play' or 'Step Forward' to begin the visualization.
                    </div>

                    <!-- Complexity Cards -->
                    <div class="complexity-container">
                        <div class="complexity-card">
                            <span class="complexity-title">Time Complexity</span>
                            <div class="complexity-value-row">
                                <div>Best: <span id="time-best" class="text-glow">-</span></div>
                                <div>Average: <span id="time-avg" class="text-glow">-</span></div>
                                <div>Worst: <span id="time-worst" class="text-glow">-</span></div>
                            </div>
                        </div>
                        <div class="complexity-card">
                            <span class="complexity-title">Space Complexity</span>
                            <div class="complexity-value" id="space-complexity">-</div>
                        </div>
                    </div>
                </div>

                <div class="info-tab-content hidden" id="info-content-code">
                    <pre class="code-editor"><code id="code-snippet">
// Code snippet will load dynamically based on selected algorithm
                    </code></pre>
                </div>
            </section>
        </main>
    </div>

    <!-- Script loading -->
    <script src="script.js"></script>
</body>
</html>
